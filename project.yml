name: Waraq
options:
  bundleIdPrefix: com.bahamut
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  RifeMetal:
    url: https://github.com/cinemore/rife-metal.git
    from: 0.1.4

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  Waraq:
    type: application
    platform: macOS
    dependencies:
      - package: RifeMetal
        product: RifeMetal
    sources:
      - path: App
      - path: Core
      - path: Engines
      - path: Library
      - path: Resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Waraq
        CFBundleLocalizations:
          - en
          - ko
          - ja
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "4"
        WaraqReleaseNotes: "프레임 생성 기술 추가"
        NSHumanReadableCopyright: "Copyright (C) 2026 Omar A. Othman. Licensed under GPL v3."
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bahamut.waraq
        PRODUCT_NAME: Waraq
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WaraqTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Waraq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bahamut.waraq.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Waraq.app/Contents/MacOS/Waraq"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Waraq:
    build:
      targets:
        Waraq: all
        WaraqTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WaraqTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
